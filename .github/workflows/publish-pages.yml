name: 只更新報告頁（不寄信）

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Cache transcripts
        uses: actions/cache@v4
        with:
          path: transcripts/
          key: transcripts-${{ github.run_id }}
          restore-keys: |
            transcripts-

      - name: 補下載逐字稿+集數列表（2026-08-02 索羅門新增，任務1d）
        # 這個 workflow 原本不下載逐字稿/episodes.json（只重算報告頁），
        # 但1d逐字稿頁需要這兩樣才能生成。download_transcripts.py 預設模式
        # 會跳過已存在的檔案（見該檔 main() 的 SKIP 分支），靠上面還原的
        # cache，正常情況下幾乎全部SKIP、只補抓新集數，不是每次重下680集。
        run: python -X utf8 download_transcripts.py

      - name: 分割哨兵（清除近期分割標的的價格快取）
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -X utf8 split_sentinel.py

      - name: 生成報告頁（--no-send 不寄信）
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -X utf8 notifier.py --no-fill --no-send

      - name: 準備 Pages 站台目錄
        run: |
          mkdir -p _site
          cp report_detail.html _site/index.html
          # 2026-08-02 索羅門新增：同 update.yml 的修正，見該檔註解
          if [ -f report_attention.html ]; then
            cp report_attention.html _site/attention.html
          fi
          # 2026-08-02 索羅門新增（任務1d），比照 update.yml 同一段註解
          if [ -f report_transcripts.html ]; then
            cp report_transcripts.html _site/transcripts.html
          fi
          if [ -d transcripts_data ]; then
            cp -r transcripts_data _site/transcripts_data
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
