name: 定期分析與寄信

on:
  schedule:
    # 週日 UTC 00:00 = 台灣時間週日早上 08:00
    - cron: "0 0 * * 0"
    # 週四 UTC 00:00 = 台灣時間週四早上 08:00
    - cron: "0 0 * * 4"
  workflow_dispatch:
    inputs:
      from_ep:
        description: '從第幾集開始補跑（0 = 用 --last 5 模式）'
        default: '0'
        required: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache transcripts
        uses: actions/cache@v4
        with:
          path: transcripts/
          key: transcripts-${{ github.run_id }}
          restore-keys: |
            transcripts-

      - name: 下載逐字稿 + 分析 + 更新績效
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          FROM_EP="${{ github.event.inputs.from_ep || '0' }}"
          if [ "$FROM_EP" != "0" ]; then
            python -X utf8 update.py --from-ep "$FROM_EP"
          else
            python -X utf8 update.py --last 5
          fi
        # 平常：--last 5（只跑最新 5 集）
        # 補跑：手動填 from_ep=400 即可回補歷史

      - name: 分割哨兵（清除近期分割標的的價格快取）
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -X utf8 split_sentinel.py

      - name: 生成完整報告並寄信
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          UNSUBSCRIBE_BASE_URL: ${{ secrets.UNSUBSCRIBE_BASE_URL }}
        run: python -X utf8 notifier.py --no-fill --detail-url https://Jack20773.github.io/stock-signal/

      - name: 準備 Pages 站台目錄
        run: |
          mkdir -p _site
          cp report_detail.html _site/index.html
          # 2026-08-02 索羅門新增：目前關注度頁面（任務檔第8節）原本只生成在
          # 本地檔案系統，沒有被複製進 _site，等於這個功能永遠不會真的上線
          # 到 GitHub Pages（完工前 Codex 審查抓到的阻塞問題）。report_attention.html
          # 若因故沒生成（見 notifier.py 的 try/except 容錯）就跳過，不讓部署失敗。
          if [ -f report_attention.html ]; then
            cp report_attention.html _site/attention.html
          fi
          # 2026-08-02 索羅門新增（任務1d）：逐字稿詳細頁，比照上面attention.html
          # 同一套「檔案若因故沒生成就跳過，不讓部署失敗」容錯模式。
          # transcripts_data/ 是逐字稿全文（純瀏覽用），前端用相對路徑
          # fetch('transcripts_data/EP<n>.txt')，兩個目錄要放在同一層才會通。
          if [ -f report_transcripts.html ]; then
            cp report_transcripts.html _site/transcripts.html
          fi
          if [ -d transcripts_data ]; then
            cp -r transcripts_data _site/transcripts_data
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 上傳執行 log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-log-${{ github.run_number }}
          path: batch.log
          retention-days: 14

  deploy:
    needs: update
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 2026-08-12 新增：部署後 canary。
  # 在這之前，週四／週日 08:00 的排程失敗是**無聲的**——沒有人會收到任何通知，
  # 網站就停在舊資料。這個 job 用 `if: always()` 確保「上游整個掛掉」時它照樣會跑，
  # 並且不只看 job 的 exit code，而是回頭 curl 正式站、比對頁面自己印出來的資料日期，
  # 因為這個專案的失敗型態多半是「CI 綠燈但東西沒更新」（signals_id_seq 撞號、
  # attention.py 整批靜默丟棄，都是綠燈事故）。
  # 🔴 只有失敗才寄信，成功不寄——每週兩封「一切正常」會把真正的告警訓練成雜訊。
  canary:
    needs: [update, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 等 Pages CDN 傳播
        # deploy-pages 回報成功之後，邊緣節點還要一段時間才會提供新內容；
        # 不等就檢查會抓到舊快取，變成假告警。canary.py 本身另外還有重試。
        if: needs.deploy.result == 'success'
        run: sleep 90

      - name: 部署後健康檢查（未通過才寄告警信）
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
        run: |
          UP="${{ needs.update.result }}"
          DP="${{ needs.deploy.result }}"
          if [ "$UP" = "success" ] && [ "$DP" = "success" ]; then
            ST="success"
          else
            ST="failure (update=$UP, deploy=$DP)"
          fi
          python -X utf8 canary.py \
            --upstream-status "$ST" \
            --max-age-days 1 \
            --retries 4 --retry-wait 45
