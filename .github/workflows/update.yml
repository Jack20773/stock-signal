name: 定期分析與寄信

on:
  schedule:
    # 週六 UTC 23:00 = 台灣時間週日早上 07:00
    - cron: "0 23 * * 6"
    # 週三 UTC 23:00 = 台灣時間週四早上 07:00
    - cron: "0 23 * * 3"
  workflow_dispatch:
    inputs:
      from_ep:
        description: '從第幾集開始補跑（0 = 用 --last 5 模式）'
        default: '0'
        required: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache transcripts
        uses: actions/cache@v4
        with:
          path: transcripts/
          key: transcripts-${{ github.run_id }}
          restore-keys: |
            transcripts-

      - name: 下載逐字稿 + 分析 + 更新績效
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          FROM_EP="${{ github.event.inputs.from_ep || '0' }}"
          if [ "$FROM_EP" != "0" ]; then
            python -X utf8 update.py --from-ep "$FROM_EP"
          else
            python -X utf8 update.py --last 5
          fi
        # 平常：--last 5（只跑最新 5 集）
        # 補跑：手動填 from_ep=400 即可回補歷史

      - name: 生成完整報告並寄信
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          UNSUBSCRIBE_BASE_URL: ${{ secrets.UNSUBSCRIBE_BASE_URL }}
        run: python -X utf8 notifier.py --no-fill --detail-url https://Jack20773.github.io/stock-signal/

      - name: 準備 Pages 站台目錄
        run: |
          mkdir -p _site
          cp report_detail.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 上傳執行 log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-log-${{ github.run_number }}
          path: batch.log
          retention-days: 14

  deploy:
    needs: update
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
