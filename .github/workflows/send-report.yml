name: 寄出訊號報告

on:
  workflow_dispatch:
    inputs:
      report_last:
        description: '顯示最新 N 集（預設 50）'
        default: '50'
        required: false
      to:
        description: '指定收件人（逗號分隔，留空則寄給 REPORT_TO + 訂閱者清單）'
        default: ''
        required: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: 生成並寄出報告
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          UNSUBSCRIBE_BASE_URL: ${{ secrets.UNSUBSCRIBE_BASE_URL }}
          MANUAL_TO: ${{ github.event.inputs.to }}
        run: |
          ARGS=(--no-fill --last "${{ github.event.inputs.report_last || '50' }}" --detail-url "https://Jack20773.github.io/stock-signal/")
          if [ -n "$MANUAL_TO" ]; then
            ARGS+=(--to "$MANUAL_TO")
          fi
          python -X utf8 notifier.py "${ARGS[@]}"
